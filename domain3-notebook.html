{id:"cloud",obj:"3.1",title:"Cloud &mdash; Responsibility, Hybrid &amp; Third Parties",html:`
<p>Cloud security starts with knowing who is actually responsible for what. The <strong>responsibility matrix</strong> (shared responsibility model) divides it: the <strong>cloud service provider</strong> secures the physical infrastructure, the hypervisor and the facilities; the <strong>customer</strong> secures their own data, identities, access control, encryption and application code.</p>
<p>Where the line falls shifts with the service model &mdash; the customer owns more in IaaS, less in SaaS &mdash; and most cloud breaches happen in the gap where each side assumed the other had it covered.</p>
<ul>
<li><strong>Hybrid considerations</strong> &mdash; a hybrid cloud mixes environments: on-premises with public cloud, or several cloud providers used together. The providers don't talk to each other, so authentication, firewall rules and server settings must be configured separately in each and kept in step by hand &mdash; a mismatch is an opening. Each one logs in its own format, which makes correlation hard, and data moving between them crosses the public internet, so it needs protecting in transit.</li>
<li><strong>Third-party vendors</strong> &mdash; you inherit their security posture without visibility into it. You cannot audit what you cannot see, and their mishandling of your data is still your incident. The controls: a <strong>vendor risk management</strong> policy, bringing vendors into your incident response process, and ongoing monitoring of their security and availability.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>"Hybrid" is used two ways. The textbook definition is on-premises plus public cloud; Professor Messer also uses it for several cloud providers at once. Either way the exam point is the same: more than one environment means more places for configuration to drift.</blockquote>
<blockquote><span class="tag">Gotcha</span>"The provider handles security" is always half true. They secure the cloud; you secure what you put <em>in</em> it. Misconfigured storage and over-broad permissions are customer-side failures every time.</blockquote>
`},
{id:"cloudmodels",obj:"3.1",title:"Cloud Service Models &amp; Providers",html:`
<div class="tblwrap"><table><caption>Who manages what</caption>
<tr><th>Model</th><th>Provider manages</th><th>Customer manages</th><th>Example</th></tr>
<tr><td><strong>IaaS</strong> &mdash; infrastructure as a service</td><td>Hardware, virtualization, network</td><td>OS, patching, apps, data, access</td><td>Rented virtual servers</td></tr>
<tr><td><strong>PaaS</strong> &mdash; platform as a service</td><td>Everything up to the OS and runtime</td><td>Their code, data and access</td><td>A managed app-hosting platform</td></tr>
<tr><td><strong>SaaS</strong> &mdash; software as a service</td><td>The whole application</td><td>Data, users and settings</td><td>Web email, CRM</td></tr>
</table></div>
<ul>
<li><strong>VPC</strong> (virtual private cloud) &mdash; a logically isolated network inside a public cloud, with its own subnets, routing and security groups.</li>
<li><strong>MSP / MSSP</strong> &mdash; a managed service provider runs your IT; a <strong>managed security service provider</strong> runs security functions such as a 24/7 SOC or SIEM monitoring. Both are third parties with privileged access to vet carefully.</li>
<li><strong>MaaS</strong> (monitoring as a service) &mdash; monitoring delivered by a provider rather than built in-house.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Going from IaaS to PaaS to SaaS, the <strong>provider takes on more</strong> and the customer less &mdash; but the customer always keeps responsibility for their data and who can access it.</blockquote>
`},
{id:"iac",obj:"3.1",title:"Infrastructure as Code",html:`
<p><strong>Infrastructure as code (IaC)</strong> defines servers, networks and policy in machine-readable files that are version-controlled and deployed automatically, instead of being configured by hand.</p>
<p>The security story cuts both ways. Consistency is the win: every environment is built from the same reviewed definition, so configuration drift largely disappears and rebuilding is trivial. The risk is that a mistake propagates just as reliably &mdash; one misconfiguration in the template becomes a misconfiguration in every environment it builds, instantly and everywhere.</p>
<p>That makes the code itself the control point: it needs access control, code review, and scanning for insecure settings before it ships.</p>
<p>In practice the definitions are template files, usually <strong>JSON or YAML</strong>, fed through a CI/CD pipeline. Because the definition isn't tied to specific hardware, the same file can rebuild the environment on demand, which is also the basis of <strong>orchestration</strong>: automatically building out a whole application instance whenever it's needed.</p>
`},
{id:"serverless",obj:"3.1",title:"Serverless",html:`
<p><strong>Serverless</strong> runs code as functions invoked on demand, with the provider handling all the underlying infrastructure. There is still a server &mdash; you just never touch it.</p>
<p>It removes a whole category of work: no OS to patch, no server to harden, no capacity to manage. That genuinely shrinks the attack surface you're responsible for.</p>
<p>What remains is entirely application-layer: securing the APIs that trigger functions, keeping function permissions minimal, validating input, and protecting data in transit and at rest. Functions given broader rights than they need are the common failure, because the blast radius of a compromised function is exactly its permission set.</p>
`},
{id:"micro",obj:"3.1",title:"Microservices",html:`
<p><strong>Microservices</strong> break an application into small independent services that communicate over the network, rather than one large <strong>monolithic</strong> application where the interface, login and business logic all live in a single executable and every update means reinstalling the whole thing.</p>
<p>Clients talk to an <strong>API gateway</strong>, which routes each request to the right service. APIs (application programming interfaces) are how the pieces are controlled programmatically, and each service can carry security matched to its job &mdash; the authentication service gets one set of controls, the database-writing service another.</p>
<p>The resilience benefit is real &mdash; one service failing doesn't take down the application, and services scale and deploy independently. The isolation also limits what a single compromised component can reach.</p>
<p>The cost is surface area. Every service is a separate thing to authenticate, authorize, patch, monitor and secure, and communication that used to happen inside one process now crosses the network where it can be intercepted. API management and service-to-service authentication become load-bearing security controls rather than architectural niceties.</p>
<blockquote><span class="tag">Gotcha</span>Microservices trade a <em>smaller blast radius per component</em> for <em>more components to defend</em>. Both halves are true, and an exam question can be written from either side.</blockquote>
`},
{id:"netinfra",obj:"3.1",title:"Network Infrastructure &mdash; Isolation, Segmentation &amp; SDN",html:`
<ul>
<li><strong>Physical isolation / air-gapped</strong> &mdash; no network connection to anything else, at all. The strongest available separation, used for classified and critical-infrastructure systems. The trade-off is operational: patching and monitoring require physically carrying media in, which is also how air-gapped systems have historically been compromised.</li>
<li><strong>Logical segmentation</strong> &mdash; separation enforced by configuration rather than cabling: VLANs, subnets, firewall rules, security groups. Far more practical, and it limits lateral movement, but it depends entirely on that configuration being correct.</li>
<li><strong>Software-defined networking (SDN)</strong> &mdash; separates the control plane from the data plane so the network is programmed centrally. Policy becomes consistent and quick to change, but the controller is a single high-value target and a potential single point of failure.</li>
</ul>
<div class="tblwrap"><table><caption>The three planes of operation</caption>
<tr><th>Plane</th><th>What it does</th><th>Examples</th></tr>
<tr><td><strong>Data plane</strong> (infrastructure layer)</td><td>Actually forwards the traffic</td><td>Switching, routing, NAT, encryption, trunking</td></tr>
<tr><td><strong>Control plane</strong></td><td>Decides where traffic goes and tells the data plane</td><td>Routing tables, session tables, dynamic routing protocols</td></tr>
<tr><td><strong>Management plane</strong></td><td>Where administrators configure the device</td><td>SSH, SNMP, APIs, the console port</td></tr>
</table></div>
<p>Splitting a device into planes is what lets it be written as software. That's how cloud platforms let you add a firewall or load balancer with a click: the device is virtual. Many SDN deployments are built on the open <strong>OpenFlow</strong> standard.</p>
<blockquote><span class="tag">Gotcha</span>Air-gapped means <em>physically</em> disconnected. A heavily firewalled VLAN with no allowed routes is still logically segmented, not air-gapped &mdash; the cable exists. VLANs are the scalable answer: one physical switch behaves like several, where true physical isolation would need a separate switch per customer or segment.</blockquote>
`},
{id:"netfund",obj:"3.1",title:"Network Building Blocks &mdash; LAN, WAN, Routing &amp; Cabling",html:`
<p>Acronym-list networking terms, with the security angle for each:</p>
<div class="tblwrap"><table><caption>Networking terms from the acronym list</caption>
<tr><th>Term</th><th>What it is</th><th>Security angle</th></tr>
<tr><td><strong>LAN / MAN / WAN</strong></td><td>Local, metropolitan and wide area networks &mdash; one building, a city, and everything larger</td><td>Trust usually falls as scope widens; WAN links cross networks you don't control, so encrypt them</td></tr>
<tr><td><strong>VLSM</strong> &mdash; variable length subnet masking</td><td>Subnets of different sizes carved from one address block</td><td>Lets segments be sized exactly, which makes segmentation practical</td></tr>
<tr><td><strong>UTP</strong> &mdash; unshielded twisted pair</td><td>Standard copper Ethernet cable</td><td>Can be tapped and emits interference; fibre is harder to tap. Protect cable runs physically</td></tr>
<tr><td><strong>ISP</strong> &mdash; internet service provider</td><td>Your upstream connection</td><td>Two different ISPs give resilience; ISPs can filter DDoS upstream</td></tr>
<tr><td><strong>DSL</strong> &mdash; digital subscriber line</td><td>Internet over telephone lines, common at small branches</td><td>Branch links need VPN or SD-WAN encryption</td></tr>
<tr><td><strong>BGP</strong> &mdash; Border Gateway Protocol</td><td>Routes traffic between networks across the internet</td><td>BGP hijacking can redirect whole address blocks; RTBH uses BGP to drop DDoS traffic</td></tr>
<tr><td><strong>OSPF</strong> &mdash; Open Shortest Path First</td><td>Routing inside an organization's network</td><td>Authenticate routing updates (HMAC) so no one can inject false routes</td></tr>
</table></div>
`},
{id:"onprem",obj:"3.1",title:"On-Premises &amp; Centralized vs. Decentralized",html:`
<p><strong>On-premises</strong> gives you full control and full responsibility &mdash; physical security, patching, monitoring and capacity are all yours. It can be made very secure, at higher cost and with far less elasticity than cloud.</p>
<div class="tblwrap"><table><caption>Centralized vs. decentralized architecture</caption>
<tr><th></th><th>Centralized</th><th>Decentralized</th></tr>
<tr><td>Policy</td><td>Consistent, enforced from one place</td><td>Varies by node; drift is common</td></tr>
<tr><td>Monitoring</td><td>One view of everything</td><td>Fragmented, harder to correlate</td></tr>
<tr><td>Failure</td><td>Single point of failure and a concentrated target</td><td>More resilient; no single kill shot</td></tr>
<tr><td>Weakness</td><td>Compromise the centre, reach everything</td><td>Securing communication between nodes</td></tr>
</table></div>
<p>Most organizations are decentralized in practice &mdash; several sites, several clouds, several operating systems. The usual fix is a consolidated view: a single console that brings together alerts, logs and patch status. That buys visibility, but if the console goes down you lose sight of everything, and it needs more storage and compute as the organization grows.</p>
`},
{id:"virtcontain",obj:"3.1",title:"Virtualization &amp; Containerization",html:`
<div class="tblwrap"><table>
<tr><th></th><th>Virtual machines</th><th>Containers</th></tr>
<tr><td>Isolates</td><td>A full guest OS per instance</td><td>The application and its dependencies, sharing the host kernel</td></tr>
<tr><td>Overhead</td><td>Heavier &mdash; each VM runs its own OS</td><td>Light and fast to start</td></tr>
<tr><td>Separation</td><td>Stronger &mdash; hypervisor-enforced</td><td>Weaker &mdash; a shared kernel is a shared failure domain</td></tr>
<tr><td>Main risk</td><td><strong>VM escape</strong>: breaking out of the guest to reach the hypervisor or host</td><td>Untrusted or unpatched <strong>images</strong>, and insecure registries</td></tr>
</table></div>
<ul>
<li><strong>Hypervisor</strong> &mdash; the software that divides hardware between virtual machines. <strong>Type 1</strong> (bare metal, native) runs directly on the hardware: ESXi, Hyper-V, KVM, XenServer. <strong>Type 2</strong> (hosted) runs as an application on a host operating system: VirtualBox, VMware Workstation.</li>
<li><strong>Containers</strong> skip the hypervisor and the guest OS. Container software such as <strong>Docker</strong> runs on a single host operating system, and each container holds everything the app needs except the OS. The trade-off is that a container is tied to its host OS family &mdash; Linux containers need a Linux host.</li>
</ul>
<p>Container security is largely supply-chain security: where the base image came from, what's inside it, whether the registry is trusted, and how quickly images get rebuilt when a dependency is patched.</p><p><strong>VDI</strong> (virtual desktop infrastructure) runs users' desktops as VMs in the data centre and streams the screen to any device; a <strong>VDE</strong> (virtual desktop environment) is the desktop the user sees. Data stays in the data centre, so a lost laptop exposes nothing, and desktops can be reset to a clean image.</p>

`},
{id:"iot",obj:"3.1",title:"IoT",html:`
<p><strong>Internet of Things</strong> devices are purpose-built, cheap, and deployed in volume &mdash; sensors, cameras, thermostats, badge readers, medical equipment.</p>
<p>The security problems follow from the economics. Limited compute means weak or absent cryptography. Vendors ship default credentials and often stop issuing firmware updates early. Devices are deployed in the hundreds with no inventory, so nobody knows what's on the network. And they're rarely covered by endpoint protection, so a compromised device sits inside the network, unmonitored, indefinitely.</p>
<p>The standard mitigation is segmentation: put them on their own network where a compromise reaches nothing that matters.</p>
`},
{id:"ics",obj:"3.1",title:"ICS / SCADA",html:`
<p><strong>Industrial control systems</strong> and <strong>SCADA</strong> (supervisory control and data acquisition) run physical processes &mdash; power generation and distribution, water treatment, manufacturing lines, building systems. A compromise has physical consequences, which makes them high-value targets for nation-state actors.</p>
<p>Operators run the plant from a central control room instead of visiting each machine. At the device level, <strong>programmable logic controllers (PLCs)</strong> and other embedded hardware do the physical work. Because a breach can be so serious, well-run SCADA networks are strictly segmented from the outside world.</p>
<p>Three properties make them hard to defend:</p>
<ol>
<li><strong>Very long lifespans.</strong> Equipment stays in service for decades, long past any vendor support.</li>
<li><strong>Availability outranks confidentiality.</strong> A production line cannot be stopped to install a patch, so the maintenance window that would let you fix things may effectively never come.</li>
<li><strong>Protocols built without security.</strong> Many industrial protocols predate any assumption of network exposure and have no authentication at all.</li>
</ol>
<p>Because patching is often impossible, defence leans on isolation and compensating controls rather than remediation.</p><p>ICS and SCADA are the core of <strong>OT</strong> (operational technology): the systems that control physical processes, as opposed to IT.</p>

`},
{id:"embedded",obj:"3.1",title:"Embedded Systems &amp; RTOS",html:`
<p>An <strong>embedded system</strong> is a computer built into a larger device to do one job &mdash; the controller in a printer, a vehicle, a medical pump. The user generally doesn't perceive it as a computer at all, which is part of the problem: it gets no patching, no monitoring, and no place in the asset inventory.</p>
<p>A <strong>real-time operating system (RTOS)</strong> is <strong>deterministic</strong>: a critical task gets the whole system's attention immediately, where general-purpose OSes like Windows and Linux are non-deterministic and share resources. Anti-lock brakes are the classic example. An RTOS is used where timing is a correctness requirement, not a preference &mdash; an airbag controller or an industrial actuator must respond within a guaranteed window. That constraint squeezes out security features that introduce variable delay, and it makes updates risky because anything altering timing can break the system's core guarantee.</p>
<p>Embedded devices are often built on an <strong>SoC</strong> (system on chip: processor, memory and radios on one chip) or an <strong>FPGA</strong> (field programmable gate array, a chip whose logic can be reprogrammed after manufacture). Both make patching hard, and a tampered FPGA configuration is a hardware-level compromise.</p>
<blockquote><span class="tag">Gotcha</span>The recurring theme across IoT, ICS/SCADA, embedded and RTOS is the same: <strong>inability to patch</strong>. When a question describes a system that can't be updated, the expected answer is almost always isolation or a compensating control, not remediation.</blockquote>
`},
{id:"considerations",obj:"3.1",title:"Architecture Considerations Checklist",html:`
<p>The objectives list the factors to weigh when comparing any two architecture models. Expect questions that hand you a scenario and ask which consideration it illustrates.</p>
<div class="tblwrap"><table><caption>The named considerations</caption>
<tr><th>Consideration</th><th>The question it answers</th></tr>
<tr><td><strong>Availability</strong></td><td>Is the system reachable when needed &mdash; <em>by the right people</em>? Measured as uptime percentage ("five nines" = 99.999%).</td></tr>
<tr><td><strong>Resilience</strong></td><td>Does it keep working when a component fails, and how fast does it come back? Measured by <strong>MTTR</strong> (mean time to repair).</td></tr>
<tr><td><strong>Cost</strong></td><td>Installation, maintenance and replacement &mdash; plus depreciation (capital expense), operational expense and tax implications.</td></tr>
<tr><td><strong>Responsiveness</strong></td><td>How quickly does it answer a request? Hard to quantify when one transaction has many steps.</td></tr>
<tr><td><strong>Scalability</strong></td><td>Can capacity grow with demand? <strong>Elasticity</strong> is how quickly it expands and contracts. Security monitoring has to scale with it.</td></tr>
<tr><td><strong>Ease of deployment</strong></td><td>How hard is it to stand up and roll out? Many moving parts, change control, and often orchestration.</td></tr>
<tr><td><strong>Risk transference</strong></td><td>Moving risk to someone else &mdash; a cloud provider, or an insurer. <strong>Cybersecurity insurance</strong> can cover ransomware losses, downtime and legal costs; it doesn't stop the attack.</td></tr>
<tr><td><strong>Ease of recovery</strong></td><td>How quickly can it be restored after failure? Reimaging from a saved image in minutes beats reinstalling from media for an hour.</td></tr>
<tr><td><strong>Patch availability</strong></td><td>Does the vendor still issue fixes, and do you test and deploy them promptly?</td></tr>
<tr><td><strong>Inability to patch</strong></td><td>The condition that forces compensating controls &mdash; embedded systems like HVAC controllers and time clocks often have no update path. Wall them off behind a firewall.</td></tr>
<tr><td><strong>Power</strong></td><td>Consumption and continuity requirements. Battery-powered and low-power devices (IoT, sensors, embedded) often can't run strong encryption or security agents, and on-premises designs are limited by the facility's power capacity and backup (UPS, generator, PDUs).</td></tr>
<tr><td><strong>Compute</strong></td><td>Processing capacity available and needed. In the cloud, a scalable compute engine rather than a single CPU.</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span><strong>Reliability, availability and durability</strong> are different measures. Availability counts all downtime, planned maintenance included. Reliability counts only failures, so a system can be more reliable but less available than another. Durability is about stored data surviving without loss or corruption over the long term.</blockquote>
`},

{id:"placement",obj:"3.2",title:"Device Placement, Security Zones &amp; Attack Surface",html:`
<p>Where a security device sits determines what it can actually see and act on. A firewall at the perimeter inspects traffic entering and leaving; it is blind to traffic between two hosts on the same internal segment.</p>
<ul>
<li><strong>Security zones</strong> group systems by use or access type, not by IP range &mdash; <strong>trusted / untrusted</strong>, or <strong>internal / external</strong>, or finer names like inside, internet, servers, databases and screened. A screened subnet (DMZ) holds public-facing services. Rules are then written between zones instead of between individual hosts, which scales and documents intent.</li>
<li><strong>Attack surface</strong> is every way in: application code, open ports, the authentication process, and human error such as one misconfigured firewall rule. You shrink it by auditing code, closing unneeded ports, and monitoring traffic in real time.</li>
<li><strong>Connectivity</strong> &mdash; how systems reach each other and the outside world, and which of those paths genuinely need to exist. Protect the cabling and wall jacks physically, encrypt at the application level in case someone taps a link, and use IPSec tunnels or a VPN concentrator for remote sites and users.</li>
</ul>
`},
{id:"failmodes",obj:"3.2",title:"Failure Modes &amp; Traffic Handling",html:`
<p>Three paired decisions define how an inline security device behaves. All three come up constantly.</p>
<div class="tblwrap"><table>
<tr><th>Choice</th><th>Meaning</th><th>Trade-off</th></tr>
<tr><td><strong>Fail-open</strong></td><td>If the device fails, traffic keeps flowing</td><td>Availability preserved, security lost</td></tr>
<tr><td><strong>Fail-closed</strong></td><td>If the device fails, traffic stops</td><td>Security preserved, availability lost</td></tr>
<tr><td><strong>Active</strong></td><td>Sits inline and can block</td><td>Can stop an attack; can also stop legitimate traffic</td></tr>
<tr><td><strong>Passive</strong></td><td>Observes a copy of traffic</td><td>Cannot break anything; cannot block anything either</td></tr>
<tr><td><strong>Inline</strong></td><td>Traffic physically passes through it</td><td>Enforcement point, and a potential bottleneck or failure point</td></tr>
<tr><td><strong>Tap / monitor</strong></td><td>Receives a mirrored copy</td><td>Zero impact on the live path; detection only</td></tr>
</table></div>
<p>A passive copy comes from a <strong>port mirror</strong>, which Cisco calls <strong>SPAN</strong> (Switch Port Analyzer), or from a physical <strong>network tap</strong> spliced into the cable. An IPS fed that way is effectively running as an IDS: it can alert, but the original traffic has already gone through.</p>
<blockquote><span class="tag">Gotcha</span>Fail-open versus fail-closed is a <strong>CIA trade-off stated as a configuration</strong>. Availability-critical environments tend to fail open; high-security environments fail closed. The "right" answer depends on what the scenario says the organization values.</blockquote>
`},
{id:"firewalls",obj:"3.2",title:"Firewall Types",html:`
<div class="tblwrap"><table><caption>The named firewall types</caption>
<tr><th>Type</th><th>What it does</th></tr>
<tr><td><strong>Web application firewall (WAF)</strong></td><td>Inspects HTTP/HTTPS input to a web application specifically, blocking SQL injection, XSS and similar application-layer attacks that a network firewall never sees. Often deployed alongside an NGFW, and required for cardholder-data apps under <strong>PCI DSS</strong>.</td></tr>
<tr><td><strong>Unified threat management (UTM)</strong></td><td>An older all-in-one appliance, also called a <strong>web security gateway</strong>: firewall, IDS/IPS, anti-malware, URL filtering, content inspection, spam filtering, VPN endpoint, routing, a CSU/DSU for the WAN link, and bandwidth shaping (QoS). Simple to run, but many look only at layer 4, performance drops as features are switched on, and it's a single point of failure.</td></tr>
<tr><td><strong>Next-generation firewall (NGFW)</strong></td><td>Operates at layer 7 with full packet decode, identifying and controlling traffic by <em>application</em> rather than just port and protocol &mdash; allow viewing a site but not posting to it, say. Also called an <strong>application layer gateway</strong>, <strong>stateful multilayer inspection</strong> or <strong>deep packet inspection</strong>. Usually adds built-in IPS signatures and URL categories (block "gambling", for example).</td></tr>
</table></div>
<p>Network-based firewalls usually also route (layer 3), perform NAT, and terminate VPNs.</p>
<p><strong>Layer 4 vs. Layer 7</strong> is the underlying distinction. A layer 4 firewall makes decisions on IP addresses, ports and protocol &mdash; fast, but it cannot tell what the traffic actually is. A layer 7 firewall reads application content, so it can distinguish one service from another riding the same port and inspect what's inside.</p>
<blockquote><span class="tag">Gotcha</span>Anything on port 443 looks identical to a layer 4 firewall. Distinguishing legitimate HTTPS from tunnelled traffic hiding inside it requires layer 7 inspection &mdash; that's the whole argument for NGFW.</blockquote>
`},
{id:"appliances",obj:"3.2",title:"Network Appliances",html:`
<ul>
<li><strong>Jump server</strong> &mdash; a single hardened, heavily logged host that administrators connect to first, often from outside the network, and from which they reach sensitive systems (SSH into a web server, for example). It collapses many administrative paths into one monitored chokepoint, which is exactly why compromising it is so valuable.</li>
<li><strong>Proxy server</strong> &mdash; an intermediary that makes requests on someone's behalf, and can cache, apply URL filtering and scan content along the way.</li>
<li><strong>IPS / IDS</strong> &mdash; intrusion <em>prevention</em> sits inline and blocks; intrusion <em>detection</em> sits passively and alerts. Same analysis, different authority to act. The network- and host-based versions (NIDS, NIPS, HIDS, HIPS) have their own topic.</li>
<li><strong>Load balancer</strong> &mdash; distributes traffic across multiple servers for both capacity and availability, and removes a failed server from rotation automatically.</li>
<li><strong>Sensors and collectors</strong> &mdash; sensors are collection points (built into switches, routers, firewalls and IPSes, or standalone) feeding traffic statistics and logs to a central <strong>collector</strong>. The collector may be a vendor console or a <strong>SIEM</strong> (security information and event management), which consolidates, correlates and reports across every source. Placement decides visibility.</li>
</ul>
<div class="tblwrap"><table><caption>Proxy types</caption>
<tr><th>Type</th><th>What sets it apart</th></tr>
<tr><td><strong>Forward proxy</strong> (internal)</td><td>Sits in front of internal users and controls their outbound requests to the internet</td></tr>
<tr><td><strong>Reverse proxy</strong></td><td>Sits in front of internal servers and receives inbound requests for them, dropping malicious ones and caching responses</td></tr>
<tr><td><strong>Explicit proxy</strong></td><td>The client or OS is configured with the proxy's name or address</td></tr>
<tr><td><strong>Transparent proxy</strong></td><td>Intercepts traffic with no client configuration; users don't know it's there</td></tr>
<tr><td><strong>Application proxy</strong></td><td>Understands a specific protocol, such as HTTP. NAT is the simplest proxy of all</td></tr>
<tr><td><strong>Open proxy</strong></td><td>Run by an unknown third party for anyone to use. Used to get around controls, and it can inject ads or malware &mdash; usually blocked</td></tr>
</table></div>
<div class="tblwrap"><table><caption>Load balancer features</caption>
<tr><th>Feature</th><th>What it means</th></tr>
<tr><td><strong>Active/active</strong></td><td>Every server is in use; a failed one is dropped and the load spread over the rest</td></tr>
<tr><td><strong>Active/passive</strong></td><td>Standby servers wait idle and are brought in when an active server fails</td></tr>
<tr><td><strong>TCP offload</strong></td><td>Keeps persistent connections to the servers instead of a new session per user</td></tr>
<tr><td><strong>SSL/TLS offload</strong></td><td>Decrypts at the load balancer, often in dedicated hardware, so servers don't have to</td></tr>
<tr><td><strong>Caching, prioritization, content switching</strong></td><td>Answers repeat requests, favours certain traffic, and sends request types to specific servers</td></tr>
</table></div>
`},
{id:"idsips",obj:"3.2",title:"IDS &amp; IPS &mdash; NIDS, NIPS, HIDS &amp; HIPS",html:`
<p>Both watch for attacks; the difference is authority. An <strong>intrusion detection system (IDS)</strong> observes and alerts. An <strong>intrusion prevention system (IPS)</strong> sits inline and can drop the traffic or end the session itself.</p>
<p>The second question is <em>where</em> it runs, which gives four combinations:</p>
<div class="tblwrap"><table><caption>Where it sits, and whether it can block</caption>
<tr><th></th><th>Detect and alert</th><th>Detect and block</th></tr>
<tr><td><strong>Network-based</strong> &mdash; watches traffic on a segment</td><td><strong>NIDS</strong> &mdash; fed a copy from a tap or SPAN port</td><td><strong>NIPS</strong> &mdash; placed inline on the traffic path</td></tr>
<tr><td><strong>Host-based</strong> &mdash; software on one endpoint</td><td><strong>HIDS</strong> &mdash; watches that machine's logs, files and processes</td><td><strong>HIPS</strong> &mdash; the same, and can stop the action on the host</td></tr>
</table></div>
<ul>
<li><strong>Network-based</strong> covers many hosts from one sensor, but it can't read encrypted payloads and has no idea what happened on the endpoint afterwards.</li>
<li><strong>Host-based</strong> sees what actually happened on the machine &mdash; including traffic after it's been decrypted, file changes and local logins &mdash; but only where it's installed, and it uses that host's resources.</li>
</ul>
<p><strong>How they decide something is an attack:</strong></p>
<ul>
<li><strong>Signature-based</strong> &mdash; matches activity against patterns of known attacks. Accurate and quiet for what it knows, blind to anything new, and only as good as its last signature update.</li>
<li><strong>Anomaly-based</strong> (behavior-based) &mdash; learns a baseline of normal and flags deviations. Can catch novel and zero-day activity, but raises more false alarms and needs a clean baseline to learn from.</li>
<li><strong>Heuristic</strong> &mdash; rules of thumb about what suspicious activity tends to look like, sitting between the two.</li>
</ul>
<div class="tblwrap"><table><caption>The four outcomes</caption>
<tr><th>Outcome</th><th>What happened</th></tr>
<tr><td><strong>True positive</strong></td><td>Real attack, and it alerted</td></tr>
<tr><td><strong>True negative</strong></td><td>Normal activity, and it stayed quiet</td></tr>
<tr><td><strong>False positive</strong></td><td>Normal activity, but it alerted &mdash; noise, and eventually alert fatigue</td></tr>
<tr><td><strong>False negative</strong></td><td>Real attack, and it stayed quiet &mdash; the dangerous one</td></tr>
</table></div>
<p>Wireless has its own versions: a <strong>WIDS</strong> (wireless intrusion detection system) watches the airspace for rogue access points, evil twins and deauthentication floods; a <strong>WIPS</strong> can also contain them, for example by blocking clients from joining a rogue AP.</p>
<blockquote><span class="tag">Gotcha</span>Placement follows from the name. An IPS must be <strong>inline</strong> to block, so it inherits the fail-open/fail-closed decision. An IDS works from a copy, so it can never break traffic &mdash; and can never stop it. And a <strong>false negative</strong> is worse than a false positive: one wastes an analyst's time, the other means the attack went through unseen.</blockquote>
`},
{id:"portsec",obj:"3.2",title:"Port Security &mdash; 802.1X &amp; EAP",html:`
<p><strong>Port security</strong> controls what is allowed to connect to a physical network port, which is the defence against someone walking in and plugging a device into a wall jack.</p>
<p><strong>802.1X</strong> is port-based network access control. A device connecting to a switch port or wireless network is placed in an unauthorized state where it can do nothing but authenticate. Three roles:</p>
<ol>
<li><strong>Supplicant</strong> &mdash; the device requesting access.</li>
<li><strong>Authenticator</strong> &mdash; the switch or access point controlling the port.</li>
<li><strong>Authentication server</strong> &mdash; the back-end credential store that makes the actual decision: usually RADIUS, but LDAP, TACACS+ or Kerberos (Active Directory) also appear.</li>
</ol>
<p>The exchange: the authenticator sends an <strong>EAP request</strong> for identity, the supplicant returns an <strong>EAP response</strong>, the authenticator relays it to the server, the server asks for credentials, and they pass back through the authenticator. Only after the server approves does the port open for normal traffic. 802.1X is also called <strong>NAC</strong> (port-based network access control), and it applies to wired switch ports as well as wireless.</p>
<p><strong>EAP</strong> (Extensible Authentication Protocol) is the framework carrying that exchange. It isn't one method but a container for many &mdash; certificate-based, credential-based, tunnelled &mdash; which is why you see variants like EAP-TLS and PEAP.</p>
`},
{id:"authproto",obj:"3.2",title:"Legacy Authentication Protocols &amp; Switch Protections",html:`
<div class="tblwrap"><table><caption>Authentication protocols from the acronym list</caption>
<tr><th>Protocol</th><th>How it works</th><th>Security</th></tr>
<tr><td><strong>PAP</strong> &mdash; Password Authentication Protocol</td><td>Sends the username and password</td><td>Cleartext &mdash; never use unprotected</td></tr>
<tr><td><strong>CHAP</strong> &mdash; Challenge Handshake Authentication Protocol</td><td>Server sends a challenge; client returns a hash of it with the shared secret</td><td>Password never crosses the wire; repeats the challenge during the session</td></tr>
<tr><td><strong>MS-CHAP / MS-CHAPv2</strong> (MSCHAP)</td><td>Microsoft's CHAP variant, used inside PEAP</td><td>Crackable; prefer EAP-TLS</td></tr>
</table></div>
<p><strong>Switch protections</strong>: switches exchange <strong>BPDUs</strong> (bridge protocol data units) to run Spanning Tree Protocol and prevent loops. <strong>BPDU guard</strong> shuts down an access port that receives a BPDU, stopping a rogue switch from being plugged in or a loop from taking the network down. 802.1X is an IEEE standard (Institute of Electrical and Electronics Engineers); EAP itself comes from the IETF.</p>
`},
{id:"securecomm",obj:"3.2",title:"Secure Communication &amp; Access",html:`
<ul>
<li><strong>VPN</strong> &mdash; an encrypted tunnel across an untrusted network. <em>Remote access</em> VPNs connect a user to the corporate network; <em>site-to-site</em> VPNs connect two networks permanently, with the firewalls at each end acting as endpoints so no client software is needed.</li>
<li><strong>VPN concentrator</strong> &mdash; the device that terminates everyone's tunnels and decrypts the traffic into the corporate network. It can be a standalone appliance, software, or built into a firewall or NGFW.</li>
<li><strong>Tunneling</strong> &mdash; encapsulating one protocol inside another, which is the mechanism a VPN is built on.</li>
<li><strong>TLS</strong> &mdash; secures traffic at the transport layer. Typical for client VPNs and for essentially all web traffic. An <strong>SSL/TLS VPN</strong> runs over TCP 443, so it passes through existing firewalls easily; it can use ordinary login credentials, run clientless in a browser, or be set <strong>always-on</strong> so the laptop connects at startup.</li>
<li><strong>IPSec</strong> &mdash; secures at the network layer, protecting all IP traffic between endpoints. Typical for site-to-site VPNs. Two modes: <em>transport</em> encrypts only the payload; <em>tunnel</em> encrypts the entire original packet, wraps it in an IPSec header and trailer, and adds a new IP header addressed to the concentrator.</li>
<li><strong>SD-WAN</strong> &mdash; software-defined wide area networking, routing traffic intelligently across multiple links (broadband, MPLS, cellular) based on policy and current conditions. It exists because applications moved to the cloud: backhauling every remote site through the data centre and then out to the cloud wastes hops.</li>
<li><strong>SASE</strong> &mdash; secure access service edge, converging SD-WAN with cloud-delivered security so policy follows the user wherever they connect from, rather than requiring traffic to be hauled back to a datacentre first.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>TLS operates at the transport layer and typically protects specific applications; IPSec operates at the network layer and protects everything between the endpoints. Client VPN leans TLS, site-to-site leans IPSec.</blockquote>
`},
{id:"vpnproto",obj:"3.2",title:"Tunneling Protocols &mdash; IPSec AH/ESP, IKE, GRE, L2TP, PPTP",html:`
<p><strong>IPSec</strong> is built from two protocols, plus a key exchange:</p>
<div class="tblwrap"><table><caption>Inside IPSec</caption>
<tr><th>Part</th><th>Provides</th><th>Note</th></tr>
<tr><td><strong>AH</strong> &mdash; Authentication Header</td><td>Integrity and authentication of the whole packet</td><td><strong>No encryption.</strong> Doesn't work through NAT, because NAT changes the headers AH protects</td></tr>
<tr><td><strong>ESP</strong> &mdash; Encapsulating Security Payload</td><td>Encryption <em>plus</em> integrity and authentication</td><td>The one almost everyone uses; works through NAT with NAT traversal (UDP 4500). AH and ESP can be combined</td></tr>
<tr><td><strong>IKE</strong> &mdash; Internet Key Exchange (IKEv2)</td><td>Negotiates keys and builds the security associations (SAs)</td><td>Uses Diffie-Hellman</td></tr>
</table></div>
<div class="tblwrap"><table><caption>Other tunneling protocols</caption>
<tr><th>Protocol</th><th>What it does</th><th>Security</th></tr>
<tr><td><strong>GRE</strong> &mdash; Generic Routing Encapsulation</td><td>Wraps almost any traffic in a tunnel</td><td>No encryption &mdash; usually run inside IPSec</td></tr>
<tr><td><strong>L2TP</strong> &mdash; Layer 2 Tunneling Protocol</td><td>Tunnels layer 2 traffic</td><td>No encryption of its own; used as L2TP/IPSec</td></tr>
<tr><td><strong>PPTP</strong> &mdash; Point-to-Point Tunneling Protocol</td><td>Early Microsoft VPN</td><td>Broken &mdash; don't use</td></tr>
<tr><td><strong>PPP</strong> &mdash; Point-to-Point Protocol</td><td>Link protocol from the dial-up era that PPTP and L2TP build on</td><td>Authenticates with PAP or CHAP</td></tr>
</table></div>
<p>Every tunnel adds headers, which shrinks the <strong>MTU</strong> (maximum transmission unit), the largest packet that fits. VPN connection problems where small pages load but large transfers hang are often MTU/fragmentation issues.</p>
<blockquote><span class="tag">Gotcha</span><strong>AH authenticates but does not encrypt; ESP encrypts.</strong> GRE and L2TP don't encrypt either &mdash; they're paired with IPSec for that.</blockquote>
`},
{id:"casbswg",obj:"3.2",title:"CASB &amp; Secure Web Gateway",html:`
<ul>
<li><strong>CASB</strong> (cloud access security broker) &mdash; sits between users and cloud services to see and control their use: discovers unsanctioned SaaS (shadow IT), enforces policy on sanctioned apps, applies DLP to uploads, and checks configurations. Works through APIs, a proxy, or both.</li>
<li><strong>SWG</strong> (secure web gateway) &mdash; a cloud or on-premises proxy that filters web traffic: URL filtering, malware scanning, TLS inspection, application control.</li>
</ul>
<p>CASB, SWG, ZTNA and firewall-as-a-service are the security components bundled into <strong>SASE</strong>.</p>
<blockquote><span class="tag">Gotcha</span><strong>CASB is about cloud apps</strong> (who uses which SaaS, and what data goes there); an <strong>SWG is about web browsing</strong> in general.</blockquote>
`},
{id:"controlsel",obj:"3.2",title:"Selection of Effective Controls",html:`
<p>The objectives close 3.2 by asking you to <em>choose</em>, not just recognize. Given a scenario, the expected reasoning runs: what is being protected, what is it worth, what threatens it, what does the control cost, and what does it break.</p>
<p>A control is effective when it addresses the actual threat in that scenario, is proportionate to the value of the asset, and doesn't impose so much friction that people route around it. The most secure configuration that stops the business working is not the correct answer, and neither is the cheapest control that leaves the threat untouched.</p>
`},

{id:"datatypes",obj:"3.3",title:"Data Types",html:`
<div class="tblwrap"><table><caption>The named data types</caption>
<tr><th>Type</th><th>What it is</th></tr>
<tr><td><strong>Regulated</strong></td><td>Data governed by law or standard &mdash; health records, cardholder data, personal data under privacy law. Handling is dictated externally.</td></tr>
<tr><td><strong>Trade secret</strong></td><td>Information whose value depends on staying secret; protection is lost once disclosed.</td></tr>
<tr><td><strong>Intellectual property</strong></td><td>Patents, designs, source code, creative work.</td></tr>
<tr><td><strong>Legal information</strong></td><td>Contracts, filings, privileged communications.</td></tr>
<tr><td><strong>Financial information</strong></td><td>Accounts, transactions, payroll.</td></tr>
<tr><td><strong>Human-readable</strong></td><td>Directly intelligible &mdash; a document, a spreadsheet.</td></tr>
<tr><td><strong>Non-human-readable</strong></td><td>Requires processing to interpret &mdash; binary formats, encoded data, database files. A barcode is both: bars for the machine, printed digits for people.</td></tr>
</table></div>
<p>Three more terms show up alongside the named types:</p>
<ul>
<li><strong>PII</strong> (personally identifiable information) &mdash; anything that ties back to a person: name, date of birth, mother's maiden name, address, biometrics.</li>
<li><strong>PHI</strong> (protected health information) &mdash; an individual's health status, records, and even their healthcare payments.</li>
<li><strong>Proprietary</strong> &mdash; data unique to the organization and used only by it, including its trade secrets.</li>
</ul>
<p>Intellectual property is often visible to others and protected by copyright and trademark law. Trade secrets are protected by keeping them hidden. Legal records are often public, but the PII inside them isn't.</p>
`},
{id:"dataclass",obj:"3.3",title:"Data Classifications",html:`
<p>Classification assigns a sensitivity label that then drives handling requirements. The objectives name six.</p>
<ul>
<li><strong>Public</strong> (unclassified) &mdash; disclosure causes no harm; intended for release.</li>
<li><strong>Private</strong> &mdash; concerns an individual and is not for general distribution.</li>
<li><strong>Sensitive</strong> &mdash; disclosure would cause harm.</li>
<li><strong>Confidential</strong> &mdash; restricted to a defined group, with meaningful consequences for disclosure.</li>
<li><strong>Restricted</strong> &mdash; tightly limited access, typically requiring explicit authorization or a signed non-disclosure agreement.</li>
<li><strong>Critical</strong> &mdash; essential to operations and must always be available; loss or corruption threatens the organization itself.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Classification and data <em>type</em> are different axes. A file can be financial (type) and confidential (classification) at once. Questions often supply one and ask for the other.</blockquote>
`},
{id:"datastates",obj:"3.3",title:"Data States",html:`
<div class="tblwrap"><table>
<tr><th>State</th><th>Where it lives</th><th>How it's protected</th></tr>
<tr><td><strong>At rest</strong></td><td>Stored on disk, in a database, on backup media</td><td>Full-disk, file, database or record-level encryption; access controls</td></tr>
<tr><td><strong>In transit</strong> (in motion)</td><td>Moving across a network</td><td>TLS, IPSec, VPN tunnels; firewall and IPS policy on the path</td></tr>
<tr><td><strong>In use</strong></td><td>Loaded in memory, being processed</td><td>The hard one &mdash; it must be decrypted to be worked on. Secure enclaves, memory encryption, strict access control</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>Data <strong>in use</strong> is the state most often overlooked and the hardest to defend, precisely because processing requires plaintext. That's what secure enclaves and memory encryption exist to address. The 2013 Target breach is the textbook case: data was encrypted at rest and in transit, but malware on the point-of-sale terminals scraped about 110 million card numbers straight out of RAM.</blockquote>
`},
{id:"sovereignty",obj:"3.3",title:"Data Sovereignty &amp; Geolocation",html:`
<p><strong>Data sovereignty</strong> is the principle that data is subject to the laws of the country it is physically stored in. Put a European customer's data on a server in another jurisdiction and you may have created a compliance violation without any technical failure occurring at all.</p>
<p>Some laws also dictate <em>where</em> data may be stored. The EU's <strong>GDPR</strong> (General Data Protection Regulation) is the standard example: data collected on EU citizens is expected to be stored in the EU.</p>
<p>This is what makes cloud region selection a legal decision rather than a performance one. Providers offer region pinning specifically so customers can satisfy sovereignty requirements.</p>
<p><strong>Geolocation</strong> is knowing where data and users actually are, which supports both compliance and security &mdash; and underpins <strong>geographic restrictions</strong> (geofencing), where access is permitted or denied based on physical location.</p>
<p>How location is determined: the <strong>IP subnet</strong> is accurate on an internal network but poor for mobile devices. <strong>GPS</strong> is precise. <strong>802.11</strong> location compares the Wi-Fi SSIDs a device can see against databases of known access points, and mobile carriers add their own data. Streaming services blocking out-of-country viewers are geofencing in action; so is granting extra data access only inside the building.</p>
`},
{id:"securemethods",obj:"3.3",title:"Methods to Secure Data",html:`
<div class="tblwrap"><table><caption>The eight named methods</caption>
<tr><th>Method</th><th>What it does</th><th>Reversible?</th></tr>
<tr><td><strong>Geographic restrictions</strong></td><td>Allows or denies access based on location</td><td>n/a &mdash; access control</td></tr>
<tr><td><strong>Encryption</strong></td><td>Makes data unreadable without the key</td><td>Yes, with the key</td></tr>
<tr><td><strong>Hashing</strong></td><td>One-way fingerprint for integrity and password storage</td><td>No</td></tr>
<tr><td><strong>Masking</strong></td><td>Hides part of a value while showing the rest</td><td>No, but vulnerable to inference</td></tr>
<tr><td><strong>Tokenization</strong></td><td>Substitutes a meaningless token mapped only by the issuing system</td><td>Only by the token vault</td></tr>
<tr><td><strong>Obfuscation</strong></td><td>Makes data hard to interpret without truly protecting it</td><td>Yes, if you know the trick</td></tr>
<tr><td><strong>Segmentation</strong></td><td>Separates data so a compromise reaches less of it</td><td>n/a &mdash; architectural</td></tr>
<tr><td><strong>Permission restrictions</strong></td><td>Limits who can read, write or delete</td><td>n/a &mdash; access control</td></tr>
</table></div>
<ul>
<li><strong>Encryption</strong> turns <strong>plaintext</strong> into <strong>ciphertext</strong>. Good ciphertext bears no resemblance to the input, a property called <strong>confusion</strong>.</li>
<li><strong>Hashing</strong> produces a fixed-length <strong>message digest</strong> (for example, SHA-256 gives 256 bits, shown as 64 hex characters). A one-character change in the input gives a completely different hash. Two different inputs producing the same hash is a <strong>collision</strong>, and algorithms prone to collisions get retired. Used for password storage, download integrity checks, and, with public-key cryptography, <strong>digital signatures</strong>.</li>
<li><strong>Obfuscation</strong> keeps code working while making it hard to read. Developers use it to protect their code, and attackers use it to hide malicious scripts. <strong>Masking</strong> is a form of it &mdash; the receipt that shows only the last four digits of a card.</li>
<li><strong>Tokenization</strong> in tap-to-pay: a token service issues one-time tokens to your phone, and the card number itself never crosses the network. No encryption or hashing is involved.</li>
<li><strong>Segmentation</strong> means splitting one huge database into several, so one breach doesn't expose everything and each part gets security matched to its content.</li>
</ul>
<p><strong>Permission restrictions</strong> in practice: access control lists and file-system or database permissions set to least privilege (a file-system ACL is sometimes written <strong>FACL</strong>), group-based rather than per-user grants, strong authentication and MFA in front of sensitive stores, and removing access promptly when people change role. Example: a payroll share readable only by the payroll group, with write access limited to two named administrators.</p>
<blockquote><span class="tag">Gotcha</span>Only <strong>encryption</strong> is reversible with a key, and only <strong>hashing</strong> is genuinely one-way. Tokenization looks like encryption but has no mathematical relationship to the original &mdash; the mapping lives in a separate vault.</blockquote>
`},

{id:"ha",obj:"3.4",title:"High Availability &mdash; Load Balancing vs. Clustering",html:`
<p><strong>High availability (HA)</strong> means the service stays reachable through failures, usually expressed as a percentage of uptime. It goes a step beyond <strong>redundancy</strong>: redundant means a spare exists, perhaps still in its box, while HA means the spare is already running and takes over automatically. HA pairs can be <strong>active/passive</strong> (the standby waits) or <strong>active/active</strong> (both carry traffic). Every added layer of HA &mdash; second firewall, second network path, second power feed &mdash; adds cost, until it becomes a business decision whether the downtime risk is worth paying to remove.</p>
<p>The two named mechanisms are often confused.</p>
<div class="tblwrap"><table>
<tr><th></th><th>Load balancing</th><th>Clustering</th></tr>
<tr><td>Purpose</td><td>Distribute work across multiple active servers</td><td>Group servers so they act as one resilient system</td></tr>
<tr><td>Primary goal</td><td>Performance and capacity, availability as a benefit</td><td>Availability and failover</td></tr>
<tr><td>On failure</td><td>The failed node is dropped from rotation</td><td>Another node takes over the failed node's role</td></tr>
<tr><td>Do the servers know about each other?</td><td>No &mdash; only the load balancer knows the pool</td><td>Yes &mdash; cluster members coordinate, usually via shared storage</td></tr>
<tr><td>Operating systems</td><td>Can differ</td><td>Usually identical, clustering is configured in the OS</td></tr>
</table></div>
<p><strong>Failover</strong> is the act of switching to the standby when the primary fails, and it should be tested rather than assumed.</p>
`},
{id:"raid",obj:"3.4",title:"RAID &mdash; Disk Redundancy",html:`
<p><strong>RAID</strong> (redundant array of inexpensive disks) spreads data across several drives so the system survives a drive failure.</p>
<div class="tblwrap"><table><caption>Common RAID levels</caption>
<tr><th>Level</th><th>How</th><th>Survives</th></tr>
<tr><td><strong>RAID 0</strong></td><td>Striping only</td><td>Nothing &mdash; faster, but one failed drive loses everything</td></tr>
<tr><td><strong>RAID 1</strong></td><td>Mirroring</td><td>One drive failure</td></tr>
<tr><td><strong>RAID 5</strong></td><td>Striping with distributed parity (3+ drives)</td><td>One drive failure</td></tr>
<tr><td><strong>RAID 6</strong></td><td>Striping with double parity</td><td>Two drive failures</td></tr>
<tr><td><strong>RAID 10</strong></td><td>Mirrors that are then striped</td><td>One drive per mirror</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span><strong>RAID is not a backup.</strong> It protects against a disk dying, not against deletion, corruption or ransomware, which it copies to every disk instantly. RAID 0 has no redundancy at all.</blockquote>
`},
{id:"sites",obj:"3.4",title:"Site Considerations &mdash; Hot, Warm &amp; Cold",html:`
<div class="tblwrap"><table><caption>Recovery sites, fastest to cheapest</caption>
<tr><th>Site</th><th>State</th><th>Recovery time</th><th>Cost</th></tr>
<tr><td><strong>Hot site</strong></td><td>Fully equipped, data replicated, staffed or ready to be &mdash; you can cut over now</td><td>Minutes</td><td>Highest</td></tr>
<tr><td><strong>Warm site</strong></td><td>Hardware and connectivity in place, but data must be restored before it's usable</td><td>Hours to days</td><td>Middle</td></tr>
<tr><td><strong>Cold site</strong></td><td>Space, power and connectivity only; all equipment and data must be brought in</td><td>Days to weeks</td><td>Lowest</td></tr>
</table></div>
<p><strong>Geographic dispersion</strong> is the requirement that the alternate site be far enough away that the same event &mdash; hurricane, flood, regional power loss &mdash; cannot take out both. A backup site across the parking lot satisfies the checklist and fails the purpose.</p>
<blockquote><span class="tag">Gotcha</span>Hot, warm and cold trade <strong>cost against recovery time</strong>, directly. If a question stresses budget constraints, it's steering toward cold; if it stresses an aggressive recovery objective, it's steering toward hot.</blockquote>
`},
{id:"diversity",obj:"3.4",title:"Platform Diversity &amp; Multi-Cloud",html:`
<p><strong>Platform diversity</strong> means deliberately not running everything on the same vendor, OS or hardware. A vulnerability or a vendor outage then takes out part of the estate rather than all of it. The cost is complexity: more platforms to patch, staff, monitor and secure, and more places for configuration to drift.</p>
<p><strong>Multi-cloud</strong> applies the same logic to providers. It removes dependence on any single cloud's availability and reduces vendor lock-in, at the price of managing different security models, different identity systems and different tooling in parallel.</p>
`},
{id:"coop",obj:"3.4",title:"Continuity of Operations &amp; Capacity Planning",html:`
<p><strong>Continuity of operations planning (COOP)</strong> is the plan for keeping the business running when normal systems are unavailable &mdash; including the manual and alternative procedures used while technology is down. It is a business plan, not purely a technical one, and it only works if people have practised it. Think paper receipts when the POS system is down, manual sign-offs, or phoning in card approvals.</p>
<p><strong>Capacity planning</strong> covers three named dimensions, and the first is the one organizations forget:</p>
<ul>
<li><strong>People</strong> &mdash; enough trained staff, including cover for absence and turnover. A recovery plan requiring a specific individual is a plan with a single point of failure.</li>
<li><strong>Technology</strong> &mdash; enough compute, storage and bandwidth for both normal load and surge.</li>
<li><strong>Infrastructure</strong> &mdash; the facilities, power and space to support it.</li>
</ul><p>This is also called <strong>CP</strong> (contingency planning).</p>

`},
{id:"testing",obj:"3.4",title:"Recovery Testing",html:`
<p>An untested recovery plan is a hypothesis. The objectives name four testing methods, in rough order of realism and disruption.</p>
<ol>
<li><strong>Tabletop exercise</strong> &mdash; participants talk through their response to a scenario in a room. Cheap, non-disruptive, good for finding gaps in the plan and in people's understanding. Nothing is actually switched over.</li>
<li><strong>Simulation</strong> &mdash; a realistic drill of the response, exercising the actions without necessarily affecting production. The familiar example is a <strong>phishing simulation</strong>: send a fake phishing email, see whether filters catch it, and assign training to whoever clicks.</li>
<li><strong>Parallel processing</strong> &mdash; the recovery systems are brought up and run alongside production, confirming they work without taking the live service down. Professor Messer also uses the term for its other meaning: spreading transactions across multiple CPUs or machines, so losing one processor doesn't stop the work. Know both.</li>
<li><strong>Failover</strong> &mdash; the real thing: production is actually cut over to the recovery system. The most conclusive test and the most disruptive.</li>
</ol>
<blockquote><span class="tag">Gotcha</span>A <strong>tabletop</strong> is discussion only &mdash; no systems are touched. If the scenario describes people walking through a scenario in a conference room, that's the answer regardless of how thorough the discussion sounds.</blockquote>
`},
{id:"backups",obj:"3.4",title:"Backups",html:`
<p>Backups are the last line, and the objectives name the decisions that make them work.</p>
<ul>
<li><strong>Onsite / offsite</strong> &mdash; onsite restores fast; offsite survives the event that destroys the site. You need both, which is the reasoning behind keeping multiple copies in more than one location.</li>
<li><strong>Frequency</strong> &mdash; determines how much data you lose in a failure. Set by the recovery point objective, not by convenience. Different systems warrant different intervals, often as multiple backup sets (daily, weekly, monthly).</li>
<li><strong>Encryption</strong> &mdash; backup media is a full copy of your data in a portable form. Unencrypted backups are a breach waiting for someone to lose a tape.</li>
<li><strong>Snapshots</strong> &mdash; point-in-time captures of a system's state, especially VMs and cloud instances. One click to take, a few clicks to roll back to; daily snapshots behave much like incremental backups. Take one before any major change.</li>
<li><strong>Replication</strong> &mdash; continuously copying data to another system. Excellent for availability, but it faithfully replicates corruption and ransomware encryption too, which is why replication is not a backup.</li>
<li><strong>Journaling</strong> &mdash; writing changes to a journal first, then committing them to the data. If power fails mid-write, the database is either untouched or can be repaired from the journal at startup, so it avoids corruption.</li>
<li><strong>Recovery</strong> &mdash; the part that actually matters. A backup that has never been restored is unverified.</li>
</ul>
<p><strong>Recovery</strong> options, from smallest to largest:</p>
<ul>
<li><strong>Single file or item</strong> &mdash; restore one deleted document or mailbox.</li>
<li><strong>Point-in-time</strong> &mdash; roll a database or VM back to a specific moment, using snapshots or journals.</li>
<li><strong>Full restore</strong> &mdash; bring back an entire system or data set from the last full plus later incremental/differential backups.</li>
<li><strong>Bare-metal / image restore</strong> &mdash; rebuild a server from nothing onto new hardware.</li>
</ul>
<p>Test restores regularly against the RTO and RPO, following a documented recovery procedure; a restore you've never practised will take longer than the plan assumes.</p>
<blockquote><span class="tag">Gotcha</span><strong>Replication is not a backup.</strong> It copies whatever happens, including the bad thing, in near real time. Backups protect against corruption precisely because they are point-in-time and separate.</blockquote>
`},
{id:"power",obj:"3.4",title:"Power Resilience",html:`
<p>Two named components, and they solve different problems on different timescales.</p>
<div class="tblwrap"><table>
<tr><th></th><th>UPS</th><th>Generator</th></tr>
<tr><td>Engages</td><td>Instantly &mdash; battery, no gap</td><td>After a short delay for start-up</td></tr>
<tr><td>Runtime</td><td>Minutes</td><td>Hours to days, while fuel lasts</td></tr>
<tr><td>Purpose</td><td>Ride out brief outages; provide time for a clean shutdown or for the generator to start</td><td>Sustain operations through an extended outage</td></tr>
</table></div>
<div class="tblwrap"><table><caption>UPS types</caption>
<tr><th>Type</th><th>How it works</th></tr>
<tr><td><strong>Offline / standby</strong></td><td>Runs on utility power and switches to battery when it fails. Cheapest.</td></tr>
<tr><td><strong>Line-interactive</strong></td><td>Boosts voltage gradually during sags, which suits areas with frequent brownouts</td></tr>
<tr><td><strong>Online / double-conversion</strong></td><td>Always runs from the battery circuit, so there is no switchover at all</td></tr>
</table></div>
<p>A UPS protects against <strong>blackouts</strong> (no power), <strong>brownouts</strong> (low voltage) and <strong>surges</strong> (excess voltage). When the battery runs low it can signal servers to shut down gracefully. A generator may power the whole building or only outlets marked for generator power.</p>
<p>They're designed to work together: the UPS covers the gap between utility power failing and the generator reaching full output. A UPS also conditions power, smoothing the sags and surges that damage equipment over time.</p>
<p>In the rack, <strong>PDUs</strong> (power distribution units) feed the servers; managed PDUs can be monitored and switched remotely, and dual PDUs on separate circuits let dual power supplies survive a circuit failure.</p>
<blockquote><span class="tag">Gotcha</span>A generator alone leaves a gap at the moment of failure &mdash; it needs seconds to start, and servers do not tolerate seconds without power. The UPS exists to cover exactly that interval.</blockquote>
`}
];

var GOTCHAS_TABLE = `
<div class="tblwrap"><table><caption>Every pink callout in Domain 3, collected</caption>
<tr><th>Pair</th><th>The distinction</th></tr>
<tr><td>Provider vs. customer responsibility</td><td>They secure the cloud; you secure what you put in it</td></tr>
<tr><td>Hybrid cloud, two usages</td><td>On-premises plus public cloud vs. several cloud providers at once &mdash; either way, more places to drift</td></tr>
<tr><td>Reliability vs. availability vs. durability</td><td>Failure downtime only vs. all downtime including maintenance vs. stored data surviving intact</td></tr>
<tr><td>Air-gapped vs. logical segmentation</td><td>Physically disconnected vs. separated by configuration</td></tr>
<tr><td>VM vs. container</td><td>Full guest OS, hypervisor-isolated vs. shared kernel, image-based risk</td></tr>
<tr><td>Type 1 vs. Type 2 hypervisor</td><td>Bare metal on the hardware vs. hosted on an operating system</td></tr>
<tr><td>Data vs. control vs. management plane</td><td>Forwards traffic vs. decides where it goes vs. where admins configure the device</td></tr>
<tr><td>Microservices trade-off</td><td>Smaller blast radius per component vs. more components to defend</td></tr>
<tr><td>Centralized vs. decentralized</td><td>Consistent policy with one target vs. resilient but drifting</td></tr>
<tr><td>Fail-open vs. fail-closed</td><td>Availability preserved vs. security preserved</td></tr>
<tr><td>Active vs. passive</td><td>Inline and can block vs. observes a copy and only alerts</td></tr>
<tr><td>Inline vs. tap/monitor</td><td>Traffic passes through it vs. receives a mirrored copy</td></tr>
<tr><td>Forward vs. reverse proxy</td><td>Protects outbound user requests vs. protects inbound requests to your servers</td></tr>
<tr><td>Explicit vs. transparent proxy</td><td>Configured on the client vs. invisible to the user</td></tr>
<tr><td>IDS vs. IPS</td><td>Detects and alerts vs. sits inline and blocks</td></tr>
<tr><td>NIDS vs. HIDS</td><td>One sensor watching a network segment vs. software watching one host from the inside</td></tr>
<tr><td>Signature vs. anomaly detection</td><td>Known patterns, blind to new attacks vs. deviation from a baseline, noisier</td></tr>
<tr><td>False positive vs. false negative</td><td>Alerted on normal activity vs. missed a real attack &mdash; the dangerous one</td></tr>
<tr><td>Layer 4 vs. Layer 7</td><td>Ports and addresses vs. application content</td></tr>
<tr><td>WAF vs. NGFW vs. UTM</td><td>Web app traffic vs. application-aware inspection vs. everything in one box</td></tr>
<tr><td>TLS vs. IPSec</td><td>Transport layer, per-application vs. network layer, all IP traffic</td></tr>
<tr><td>IPSec transport vs. tunnel mode</td><td>Encrypts the payload vs. encrypts the whole original packet</td></tr>
<tr><td>Data type vs. classification</td><td>What the data is vs. how sensitive it is &mdash; two separate axes</td></tr>
<tr><td>At rest / in transit / in use</td><td>Stored vs. moving vs. being processed &mdash; in use is the hard one</td></tr>
<tr><td>Encryption vs. tokenization vs. masking</td><td>Reversible with a key vs. mapped by a vault vs. partially hidden and inferable</td></tr>
<tr><td>Load balancing vs. clustering</td><td>Distributing work vs. failing over a role</td></tr>
<tr><td>Redundancy vs. high availability</td><td>A spare exists vs. the spare is already running and takes over automatically</td></tr>
<tr><td>Active/active vs. active/passive</td><td>Every node carries load vs. standbys wait until needed</td></tr>
<tr><td>Hot vs. warm vs. cold site</td><td>Recovery time bought with cost</td></tr>
<tr><td>Tabletop vs. failover test</td><td>Discussion only vs. actually cutting production over</td></tr>
<tr><td>Parallel processing, two meanings</td><td>Recovery systems run alongside production vs. work spread across multiple CPUs</td></tr>
<tr><td>Replication vs. backup</td><td>Copies everything including the damage vs. point-in-time and separate</td></tr>
<tr><td>UPS vs. generator</td><td>Instant but brief vs. delayed but sustained &mdash; you need both</td></tr>
<tr><td>AH vs. ESP</td><td>Authentication and integrity only vs. encryption plus integrity</td></tr>
<tr><td>IaaS vs. PaaS vs. SaaS</td><td>You manage the OS up vs. just your code and data vs. just your data and users</td></tr>
<tr><td>CASB vs. SWG</td><td>Controls use of cloud apps vs. filters web browsing</td></tr>
<tr><td>PAP vs. CHAP</td><td>Cleartext password vs. hashed challenge-response</td></tr>
<tr><td>RAID vs. backup</td><td>Survives a disk failure vs. recovers from deletion, corruption and ransomware</td></tr>
</table></div>
<p style="font-size:13px;color:var(--text-muted);">Keep this list under 10% of your own marks when you transfer any of it &mdash; if everything's a gotcha, nothing is.</p>
`;

var SEARCH_INDEX = {};
(function buildIndex(){
  var scratch = document.createElement("div");
  TOPICS.forEach(function(t){
    scratch.innerHTML = t.title + " " + t.html;
    SEARCH_INDEX[t.id] = (scratch.textContent || "").toLowerCase();
  });
})();

var activeTab = "all";
var query = "";
var openIds = {};

var tabsEl = document.getElementById("tabs");
function buildTabs(){
  tabsEl.innerHTML = "";
  TAB_ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (activeTab === k && !query ? " active" : "");
    b.textContent = TAB_LABEL[k];
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){
      activeTab = k;
      searchInput.value = "";
      query = "";
      clearBtn.hidden = true;
      render();
    });
    tabsEl.appendChild(b);
  });
}

var searchInput = document.getElementById("search");
var clearBtn = document.getElementById("clear-search");
searchInput.addEventListener("input", function(){
  query = searchInput.value.trim().toLowerCase();
  clearBtn.hidden = query.length === 0;
  render();
});
clearBtn.addEventListener("click", function(){
  searchInput.value = "";
  query = "";
  clearBtn.hidden = true;
  render();
});

var listEl = document.getElementById("topiclist");
var emptyEl = document.getElementById("empty-state");
var notesEl = document.getElementById("results-note");

function matchingTopics(){
  if(query){
    return TOPICS.filter(function(t){ return SEARCH_INDEX[t.id].indexOf(query) !== -1; });
  }
  if(activeTab === "all") return TOPICS;
  if(activeTab === "gotchas") return [];
  return TOPICS.filter(function(t){ return t.obj === activeTab; });
}

function topicCard(t, forceOpen){
  var isOpen = !!openIds[t.id] || forceOpen;
  var div = document.createElement("div");
  div.id = "t-" + t.id;
  div.className = "topic" + (isOpen ? " open" : "");
  div.innerHTML =
    '<button class="topic-head" type="button">' +
      '<h2>' + t.title + '</h2>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        '<span class="topic-badge">' + t.obj + '</span>' +
        '<span class="chev">&#9656;</span>' +
      '</span>' +
    '</button>' +
    '<div class="topic-body">' + t.html + '</div>';
  div.querySelector(".topic-head").addEventListener("click", function(){
    var nowOpen = !div.classList.contains("open");
    div.classList.toggle("open", nowOpen);
    openIds[t.id] = nowOpen;
  });
  return div;
}

function render(){
  buildTabs();
  listEl.innerHTML = "";
  notesEl.hidden = true;
  emptyEl.hidden = true;

  if(activeTab === "gotchas" && !query){
    var card = document.createElement("div");
    card.className = "topic open";
    card.innerHTML =
      '<button class="topic-head" type="button"><h2>Domain 3 Gotchas &mdash; quick-scan compare cards</h2>' +
      '<span class="chev">&#9656;</span></button>' +
      '<div class="topic-body">' + GOTCHAS_TABLE + '</div>';
    card.querySelector(".topic-head").addEventListener("click", function(){
      card.classList.toggle("open");
    });
    listEl.appendChild(card);
    return;
  }

  var matches = matchingTopics();

  if(query){
    notesEl.hidden = false;
    notesEl.textContent = matches.length + (matches.length === 1 ? ' result for "' : ' results for "') + searchInput.value.trim() + '"';
  }

  if(matches.length === 0){
    emptyEl.hidden = false;
    return;
  }

  matches.forEach(function(t){
    var forceOpen = !!query && matches.length <= 6;
    listEl.appendChild(topicCard(t, forceOpen));
  });

  if(!query && matches.length > 0 && Object.keys(openIds).length === 0){
    listEl.firstChild.classList.add("open");
  }
}

render();

/* open a topic when arriving from a link like notebook.html#topic-id */
function openFromHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(!h || !TOPICS.some(function(t){ return t.id === h; })) return;
  activeTab = "all"; query = ""; searchInput.value = ""; clearBtn.hidden = true;
  openIds = {}; openIds[h] = true;
  render();
  var el = document.getElementById("t-" + h);
  if(!el) return;
  setTimeout(function(){
    var bar = document.querySelector(".topbar");
    var y = el.getBoundingClientRect().top + window.pageYOffset - (bar ? bar.offsetHeight : 0) - 12;
    window.scrollTo(0, Math.max(0, y));
  }, 50);
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
})();
</script>
